<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Septona | Multi-order workspace</title><style>html,body{height:100%;margin:0}iframe{display:block;border:0;width:100%;height:100%}</style></head><body><iframe id="workspace" title="Septona multi-order editor"></iframe><script>const frame=document.getElementById('workspace');frame.addEventListener('load',async function(){const doc=this.contentDocument;if(!doc.querySelector('[data-key="supplier"]'))return;for(const src of ['supplier-lookup.js?v=1','order-import.js?v=1']){try{await new Promise((resolve,reject)=>{const s=doc.createElement('script');s.src=src;s.onload=resolve;s.onerror=reject;doc.head.append(s);});}catch(_){const p=doc.createElement('p');p.textContent='An optional addon script failed to load. Check deployment files. Manual editor remains available.';doc.body.prepend(p);}}});frame.src='index.html';</script></body></html>
